<div class="faq-container-custom">
    <div class="faq-header-custom">
        <h1>FAQ</h1>
        <div class="faq-filters-custom">
            <div class="filter-group-custom">
                <label for="main-filter">Filter</label>
                <select id="main-filter" class="form-control">
                    <option value="All">All</option>
                    <!-- Add other main filters if needed -->
                </select>
            </div>
            <div class="filter-group-custom">
                <label for="sub-category-filter">Sub Category Filter</label>
                <select id="sub-category-filter" class="form-control">
                    <option value="All">All</option>
                    <!-- Sub-categories populated by JS -->
                </select>
            </div>
            <div class="search-group-custom">
                <label for="faq-search">Search</label>
                <input type="text" id="faq-search" class="form-control" placeholder="Search...">
            </div>
        </div>
    </div>
    <div id="faq-list-custom" class="faq-list-custom">
        <!-- FAQs will be populated by JS -->
    </div>
</div>
